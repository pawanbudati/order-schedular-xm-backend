name: Deploy Backend to AWS Windows VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend via SSH to AWS Windows VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_WINDOWS_VM_HOST }}
          username: ${{ secrets.AWS_WINDOWS_VM_USERNAME }}
          key: ${{ secrets.AWS_WINDOWS_VM_SSH_KEY }}
          password: ${{ secrets.AWS_WINDOWS_VM_PASSWORD }}
          script: |
            powershell -ExecutionPolicy Bypass -Command "& { $env:PM2_HOME = 'C:\pm2'; $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User'); $appDir = 'C:\apps\order-schedular-xm-backend'; Write-Host '🚀 Deploying order-schedular-xm-backend to AWS Windows VM...'; if (-not (Test-Path -Path $appDir)) { Write-Host 'Cloning repository for the first time...'; New-Item -ItemType Directory -Force -Path 'C:\apps' | Out-Null; git clone https://github.com/pawanbudati/order-schedular-xm-backend.git $appDir }; Set-Location -Path $appDir; git pull origin main; npm install; npm run build; pm2 delete order-schedular-xm-backend 2>$null; pm2 start pm2.config.js; pm2 save; Write-Host '✅ Backend successfully deployed and running on PM2 on AWS Windows VM!' }"




