name: Deploy Backend & MT5 Bridge to GCP VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend & Setup Headless MT5 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            echo "🚀 Deploying order-schedular-xm-backend to GCP VM..."
            if [ ! -d "$HOME/order-schedular-xm-backend" ]; then
              echo "Cloning repository for the first time..."
              git clone https://github.com/pawanbudati/order-schedular-xm-backend.git $HOME/order-schedular-xm-backend
            fi
            
            cd $HOME/order-schedular-xm-backend
            git pull origin main
            npm install
            npm run build
            
            # Restart Node.js backend engine on PM2 (Port 8444)
            pm2 restart pm2.config.js || pm2 start pm2.config.js
            echo "✅ Backend successfully deployed and running on PM2!"

            # Automatically Start Headless XM MT5 Docker container if XM Secrets are set
            if [ -n "${{ secrets.XM_ACCOUNT_ID }}" ] && [ -n "${{ secrets.XM_PASSWORD }}" ]; then
              echo "🐳 Ensuring Headless XM MT5 Docker container is running on port 8080..."
              if ! sudo docker ps -a | grep -q xm-mt5-bridge; then
                sudo docker run -d \
                  --name xm-mt5-bridge \
                  -e MT5_ACCOUNT="${{ secrets.XM_ACCOUNT_ID }}" \
                  -e MT5_PASSWORD="${{ secrets.XM_PASSWORD }}" \
                  -e MT5_SERVER="${{ secrets.XM_SERVER_NAME }}" \
                  -p 8080:8080 \
                  --restart always \
                  gotson/docker-mt5 || true
                echo "✅ Headless XM MT5 Docker container started!"
              else
                echo "✅ Headless XM MT5 Docker container is already running."
              fi
            fi
